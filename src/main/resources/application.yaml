spring:
#  数据库
  datasource:
    url: jdbc:mysql://localhost:3306/chatting?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
#    控制器追踪页面
  thymeleaf:
    cache: false
    encoding: UTF-8 # 模板编码
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML5
  mvc:
    static-path-pattern: /static/**
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 64       # 最大连接数
          min-idle: 10         # 最小空闲连接数

#        mybatis
mybatis:
    mapper-locations: classpath:mapper/*.xml  #对应mapper映射xml文件所在路径
    type-aliases-package: com.example.chatting_in_web.entity  #对应实体类路径
ai:
  queue:
    name: "ai:queue"
  lock:
      prefix: "ai:lock:user:"
      wait-seconds: 5
      lease-seconds: 300
  response:
      topic-prefix: "ai:responses:"
  deepseek:
    api-key: Bearer sk-14b3f5ab12744c25a50abfeb259eadd8 # 替换为你的DeepSeek API密钥
    base-url: https://api.deepseek.com/chat/completions # DeepSeek API的基础URL
    model: deepseek-chat
    max-tokens: 2048
    temperature: 0.7
    top-p: 1.0
    timeout:
      seconds: 120 # 请求超时时间，单位为毫秒


redisson:
  address: "redis://127.0.0.1:6379"
  password: ""          # 若无密码留空
  connectionPoolSize: 64
  connectionMinimumIdleSize: 10