spring:
#  数据库
  datasource:
    url: jdbc:mysql://localhost:3306/chatting?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
#    控制器追踪页面
  thymeleaf:
    cache: false
    encoding: UTF-8 # 模板编码
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML5
  mvc:
    static-path-pattern: /static/**
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

#        mybatis
mybatis:
    mapper-locations: classpath:mapper/*.xml  #对应mapper映射xml文件所在路径
    type-aliases-package: com.example.chatting_in_web.entity  #对应实体类路径
ai:
  deepseek:
    api-key: Bearer 1111111 # 替换为你的DeepSeek API密钥
    base-url: https://api.deepseek.com/chat/completions # DeepSeek API的基础URL
    model: deepseek-chat # 使用的模型，可以根据需要更改为其他模型，如deepseek-v2等
    max-tokens: 2048
    temperature: 0.7
    top-p: 1.0
    timeout:
      seconds: 30 # 请求超时时间，单位为毫秒